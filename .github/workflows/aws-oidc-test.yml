name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c \
            'import sys,json; print(json.load(sys.stdin)["value"])')

          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("repository_id:", claims.get("repository_id"))
          print("repository_owner:", claims.get("repository_owner"))
          print("repository_owner_id:", claims.get("repository_owner_id"))
          print("ref:", claims.get("ref"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::927678863298:role/agriculture-data-pipeline-github-actions-role
          role-session-name: GitHubActionsOIDCTest
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity